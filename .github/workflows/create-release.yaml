name: "🏷️ Create release"
run-name: "🏷️ Create release triggered by @${{ github.actor }}"

on:
  workflow_call:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    name: "🏷️ Create release ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6
      - name: "Create release ${{ github.ref_name }} step"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes
